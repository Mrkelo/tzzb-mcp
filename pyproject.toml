[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tzzb-mcp"
version = "0.1.0"
description = "同花顺投资账本 MCP 服务"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "websocket-client>=1.8.0",
    "pydantic>=2.0.0",
]

[project.scripts]
tzzb-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
